services:
  html-drop:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: html-drop
    env_file:
      - ./backend/.env
    ports:
      - "20080:8000"
    volumes:
      # 数据与上传目录持久化到宿主机
      - /vol1/data/HTMLDrop/data:/app/backend/data
      - /vol1/data/HTMLDrop/uploads:/app/backend/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
